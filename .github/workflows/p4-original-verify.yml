          mkdir -p scout-rehearsal-source-evidence
          python - <<'PYCODE'
          import hashlib, io, json, os, subprocess, tarfile
          from pathlib import Path
          repo = Path.cwd()
          fixture = json.loads((repo / 'tests/fixtures/npc-scout-legacy.json').read_text())
          generated = fixture['generatedBy']
          for path_key, hash_key in (('path', 'sha256'), ('preparationPath', 'preparationSha256')):
              assert hashlib.sha256((repo / generated[path_key]).read_bytes()).hexdigest() == generated[hash_key]
          # Original fixture generation preceded only the package release-label bump.
          # Keep its actual historical metadata; prove dependency contents are identical.
          original_lock = subprocess.check_output(['git', 'show', 'cc19bf5e1a459cf8e667ca55f4891ca9ffd25a71:package-lock.json'])
          assert hashlib.sha256(original_lock).hexdigest() == generated['dependencyLockSha256']
          before_lock = json.loads(original_lock)
          after_lock = json.loads((repo / 'package-lock.json').read_text())
          assert before_lock['version'] == before_lock['packages']['']['version'] == '0.6.21-alpha.1'
          assert after_lock['version'] == after_lock['packages']['']['version'] == '0.6.22-alpha.2'
          before_lock['version'] = before_lock['packages']['']['version'] = '0.6.22-alpha.2'
          assert before_lock == after_lock
          roots = {}
          for key, original in fixture['sourceBindings'].items():
              binding = dict(original)
              root = Path(os.environ['RUNNER_TEMP']) / ('scout-source-r' + key)
              root.mkdir()
              archive = subprocess.check_output(['git', 'archive', binding['sourceSha'], 'src', 'package.json', 'package-lock.json', 'tsconfig.json'])
              with tarfile.open(fileobj=io.BytesIO(archive)) as tar:
                  tar.extractall(root, filter='data')
              (root / 'node_modules').symlink_to(repo / 'node_modules', target_is_directory=True)
              for item in binding['sourceFiles']:
                  data = (root / item['path']).read_bytes()
                  assert hashlib.sha256(data).hexdigest() == item['sha256'], item['path']
              binding['root'] = str(root)
              roots[key] = binding
          target = repo / 'scout-rehearsal-source-evidence' / 'historical-preparation.json'
          target.write_text(json.dumps({'schema': 'infinity-scout-historical-preparation-v1', 'sourceBindings': roots}, indent=2) + '\n')
          PYCODE
          node --import tsx scripts/scout-historical-fixtures.mjs verify scout-rehearsal-source-evidence/historical-preparation.json > scout-rehearsal-source-evidence/historical-verification.json
      - name: Paid scout, historical rehearsal, separate attack and second observation
        run: |
          (cd "$RUNNER_TEMP/scout-current" && node --import tsx scripts/scout-rehearsal-natural-route.ts --legacy-root "$RUNNER_TEMP/scout-source-r13" --output "$GITHUB_WORKSPACE/scout-rehearsal-source-evidence/natural-report.json")
          sha256sum scout-rehearsal-source-evidence/natural-report.json > scout-rehearsal-source-evidence/natural-report.sha256.txt
          python -m unittest discover -s scripts -p 'test_scout_rehearsal_acceptance.py' -v
          python -m unittest discover -s scripts -p 'test_scout_fixture_identity.py' -v
      - name: Offline exact scout comparison provenance acceptance and mandatory gate
        run: |
          python -m unittest discover -s scripts -p 'test_scout_comparison_provenance.py' -v
          python -m unittest discover -s scripts -p 'test_scout_comparison_acceptance.py' -v
          python -m unittest discover -s scripts -p 'test_scout_comparison_gate.py' -v
      - name: Bind exact scout source assets runtime and complete fixture outputs
        id: common_identity
        run: python scripts/parallel-gate-identity.py --source-root "$RUNNER_TEMP/scout-current" --scout-fixtures
      - name: Browser prerequisites
        timeout-minutes: 4
        run: bash scripts/browser-prerequisites.sh
      - name: Native scout rehearsal, authority and four-width acceptance
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > scout-rehearsal-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          READY=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/Infinity/release.json > /dev/null; then READY=1; break; fi
            sleep 1
          done
          test "$READY" = 1
          CHROME="$(command -v google-chrome || command -v google-chrome-stable)"
          python scripts/browser-scout-rehearsal.py --url http://127.0.0.1:4173/Infinity/ --natural-report scout-rehearsal-source-evidence/natural-report.json --expected-report-sha256 "$(sha256sum scout-rehearsal-source-evidence/natural-report.json | cut -d' ' -f1)" --expected-sha "$GITHUB_SHA" --chromium "$CHROME" --output scout-rehearsal-evidence
          python scripts/browser-scout-comparison.py --url http://127.0.0.1:4173/Infinity/ --natural-report scout-rehearsal-source-evidence/natural-report.json --expected-report-sha256 "$(sha256sum scout-rehearsal-source-evidence/natural-report.json | cut -d' ' -f1)" --expected-sha "$GITHUB_SHA" --chromium "$CHROME" --output scout-comparison-evidence
      - name: Archive exact readable rehearsal source
        if: always()
        run: git archive --format=zip --prefix=Infinity/ HEAD > scout-rehearsal-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scout-rehearsal-${{ github.sha }}
          path: |
            dist
            scout-rehearsal-source.zip
            common-identity.json
            scout-fixture-identity.json
            scout-rehearsal-source-evidence
            scout-rehearsal-evidence
            scout-comparison-evidence
            scout-rehearsal-preview.log
          retention-days: 7
          if-no-files-found: error

  required-gates:
    # Always fail closed for failed, cancelled, missing, or unexpectedly skipped jobs.
    # The existing [deep-source] source-only convention never constitutes release acceptance.
    if: ${{ always() && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[deep-source]')) }}
    needs: [verify, verify-continuation, npc-orbital, scout-rehearsal]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all four jobs and exact source asset runtime and fixture identities
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PYCODE'
          import json, os, re
          jobs = json.loads(os.environ['JOB_RESULTS'])
          assert set(jobs) == {'verify', 'verify-continuation', 'npc-orbital', 'scout-rehearsal'}, jobs
          for name, job in jobs.items():
              assert job['result'] == 'success', (name, job['result'])
          def hashes_for(names, key):
              hashes = [jobs[name]['outputs'].get(key, '') for name in names]
              assert all(re.fullmatch('[0-9a-f]{64}', digest) for digest in hashes), (key, hashes)
              assert len(set(hashes)) == 1, (key, hashes)
              return hashes[0]
          common = hashes_for(jobs, 'common-identity-sha256')
          orbital = hashes_for(('verify', 'verify-continuation', 'npc-orbital'), 'orbital-identity-sha256')
          scout = hashes_for(('scout-rehearsal',), 'scout-fixture-sha256')
          print(json.dumps({'status':'passed','sameSourceAssetsRuntime':common,'sameCompleteOrbitalFixturePool':orbital,'completeScoutFixtures':scout}))
          PYCODE
