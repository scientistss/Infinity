name: Verify original P4
on:
  push:
    branches: ['feat/p4-original-*', 'dev/p4-original-69eca71', 'release/original-*', 'codex/infinity-rebuild-*']
  pull_request:
    branches: ['main', 'dev/p4-original-69eca71']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: original-p4-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[deep-source]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- --reporter=default --reporter=json --outputFile=test-results.json
      - name: Original UI and single-world regression
        run: |
          node scripts/check-ui-baseline.mjs > original-ui-report.json
          mkdir -p "$RUNNER_TEMP/original-p3"
          git archive 69eca7107980cce3c4c24ce4736a91993c051fbd | tar -x -C "$RUNNER_TEMP/original-p3"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/original-p3/node_modules"
          node --import tsx scripts/check-original-parity.mjs "$RUNNER_TEMP/original-p3" > parity-report.json
          npm run sim -- 60 | tee balance-report.txt
      - name: Browser prerequisites
        timeout-minutes: 4
        run: bash scripts/browser-prerequisites.sh
      - name: Native browser acceptance including real-time charging and ring interactions
        run: |
          node --import tsx scripts/p4-1-fixture.ts > p4-1-review-save.json
          node --import tsx scripts/space-fixture.ts > space-review-save.json
          mkdir -p deep-fixtures
          for scenario in pirate alien merchant blackhole-protected blackhole-risk; do
            node --import tsx scripts/deep-fixture.ts "$scenario" > "deep-fixtures/$scenario.json"
          done
          npm run preview -- --host 127.0.0.1 --port 4173 > preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/Infinity/release.json > /dev/null; then break; fi
            sleep 1
          done
          python scripts/browser-p4-1.py --fixture p4-1-review-save.json
          python scripts/browser-space.py --fixture space-review-save.json
          python scripts/browser-deep.py
          node --import tsx scripts/ring-fixture.mjs > ring-review-save.json
          python scripts/browser-ring.py
          node --import tsx scripts/deep-dashboard-fixture.mjs > deep-dashboard-review.json
          python scripts/browser-deep-dashboard.py
          node --import tsx scripts/save-session-fixture.ts > save-session-review-save.json
          python scripts/browser-save-session.py --fixture save-session-review-save.json
      - name: Archive exact readable source
        if: always()
        run: git archive --format=zip --prefix=Infinity/ HEAD > source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-deep-${{ github.sha }}
          path: |
            dist
            source.zip
            browser-evidence
            space-evidence
            deep-evidence
            ring-evidence
            dashboard-evidence
            save-session-evidence
            deep-fixtures
            test-results.json
            original-ui-report.json
            parity-report.json
            balance-report.txt
            preview.log
          retention-days: 7
          if-no-files-found: error
