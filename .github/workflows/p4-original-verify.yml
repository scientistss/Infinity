name: Verify original P4
on:
  push:
    branches: ['feat/p4-original-*', 'dev/p4-original-69eca71', 'release/original-*']
  pull_request:
    branches: ['main', 'dev/p4-original-69eca71']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: original-p4-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Original UI and asset integrity
        run: node scripts/check-ui-baseline.mjs > original-ui-report.json
      - run: npm run build
      - run: npm test -- --reporter=default --reporter=json --outputFile=test-results.json
      - name: Original-engine parity and pacing
        run: |
          mkdir -p "$RUNNER_TEMP/original-p3"
          git archive 69eca7107980cce3c4c24ce4736a91993c051fbd | tar -x -C "$RUNNER_TEMP/original-p3"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/original-p3/node_modules"
          node --import tsx scripts/check-original-parity.mjs "$RUNNER_TEMP/original-p3" > parity-report.json
          npm run sim -- 60 | tee balance-report.txt
      - name: Install browser acceptance dependencies
        run: |
          python -m pip install -r scripts/browser-requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Real HTTP browser and save isolation acceptance
        run: |
          node --import tsx scripts/p4-1-fixture.ts > p4-1-review-save.json
          node --import tsx scripts/space-fixture.ts > space-review-save.json
          npm run preview -- --host 127.0.0.1 --port 4173 > preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/Infinity/ > /dev/null; then break; fi
            sleep 1
          done
          python scripts/browser-p4-1.py --fixture p4-1-review-save.json
          python scripts/browser-space.py --fixture space-review-save.json
      - name: Archive exact readable source
        if: always()
        run: git archive --format=zip --prefix=Infinity/ HEAD > original-p4-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-p4-${{ github.sha }}
          path: |
            dist
            browser-evidence
            space-evidence
            original-p4-source.zip
            test-results.json
            parity-report.json
            original-ui-report.json
            balance-report.txt
            preview.log
          retention-days: 7
          if-no-files-found: error
