name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- --reporter=default --reporter=json --outputFile=test-results.json
      - name: Browser prerequisites
        timeout-minutes: 4
        run: bash scripts/browser-prerequisites.sh
      - name: Pre-deployment real-time deep-space and ring acceptance
        run: |
          mkdir -p deep-fixtures
          for scenario in pirate alien merchant blackhole-protected blackhole-risk; do
            node --import tsx scripts/deep-fixture.ts "$scenario" > "deep-fixtures/$scenario.json"
          done
          npm run preview -- --host 127.0.0.1 --port 4173 > preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/Infinity/release.json > /dev/null; then break; fi
            sleep 1
          done
          python scripts/browser-deep.py
          node --import tsx scripts/ring-fixture.mjs > ring-review-save.json
          python scripts/browser-ring.py
          node --import tsx scripts/deep-dashboard-fixture.mjs > deep-dashboard-review.json
          python scripts/browser-deep-dashboard.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-preflight-${{ github.sha }}
          path: |
            deep-evidence
            ring-evidence
            dashboard-evidence
            test-results.json
            preview.log
          retention-days: 7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Public release and file hash verification
        run: node scripts/verify-live.mjs | tee live-hashes.json
      - name: Browser prerequisites
        timeout-minutes: 4
        run: bash scripts/browser-prerequisites.sh
      - name: Public website native browser acceptance
        run: |
          mkdir -p deep-fixtures
          for scenario in pirate alien merchant blackhole-protected blackhole-risk; do
            node --import tsx scripts/deep-fixture.ts "$scenario" > "deep-fixtures/$scenario.json"
          done
          python scripts/browser-deep.py --url https://scientistss.github.io/Infinity/
          node --import tsx scripts/ring-fixture.mjs > ring-review-save.json
          python scripts/browser-ring.py --url https://scientistss.github.io/Infinity/
          node --import tsx scripts/deep-dashboard-fixture.mjs > deep-dashboard-review.json
          python scripts/browser-deep-dashboard.py --url https://scientistss.github.io/Infinity/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-live-${{ github.sha }}
          path: |
            deep-evidence
            ring-evidence
            dashboard-evidence
            live-hashes.json
            dist
          retention-days: 7
