name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Install browser acceptance dependencies
        run: |
          python -m pip install -r scripts/browser-requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Pre-deployment native acceptance
        run: |
          npx tsx scripts/p4-fixture.ts > p4-review-save.json
          npm run preview -- --host 127.0.0.1 --port 4173 > preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/Infinity/release.json > /dev/null; then break; fi
            sleep 1
          done
          python scripts/browser-smoke.py --verify-dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infinity-preflight-${{ github.sha }}
          path: |
            browser-evidence
            preview.log
          retention-days: 7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install browser acceptance dependencies
        run: |
          python -m pip install -r scripts/browser-requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Wait for the committed release at the public URL
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          url = 'https://scientistss.github.io/Infinity/release.json'
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(url + '?verify=' + os.environ['GITHUB_SHA'], timeout=15) as response:
                      release = json.load(response)
                  if release.get('sourceRevision') == os.environ['GITHUB_SHA']:
                      print(json.dumps(release))
                      break
              except Exception as error:
                  print(type(error).__name__)
              time.sleep(5)
          else:
              raise SystemExit('Public release did not converge to the expected commit')
          PY
      - name: Public website browser and asset-hash acceptance
        run: |
          npx tsx scripts/p4-fixture.ts > p4-review-save.json
          python scripts/browser-smoke.py --url https://scientistss.github.io/Infinity/ --verify-dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infinity-live-${{ github.sha }}
          path: |
            dist
            browser-evidence
          retention-days: 7
