name: Assemble reviewed space source

on:
  push:
    branches: ['feat/p4-original-space']
    paths: ['.space-stage/ready.json']

permissions:
  contents: write

concurrency:
  group: assemble-original-space
  cancel-in-progress: false

jobs:
  assemble:
    if: github.repository == 'scientistss/Infinity' && github.ref == 'refs/heads/feat/p4-original-space'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply reviewed text edits and verify the complete file tree
        run: |
          python - <<'PY'
          import json, hashlib, pathlib
          sha = lambda b: hashlib.sha256(b).hexdigest()
          plan = json.loads(pathlib.Path('.space-stage/edits.json').read_text())
          assert len(plan) == 17
          seen, outputs = set(), []
          for f in plan:
              name = f['path']
              assert name not in seen and not name.startswith('/') and '..' not in name.split('/')
              seen.add(name)
              target = pathlib.Path(name)
              assert not target.is_symlink() and all(not p.is_symlink() for p in target.parents)
              original = target.read_bytes()
              assert sha(original) == f['before'], 'Input mismatch: ' + name
              lines = original.decode().splitlines(keepends=True)
              previous = 0
              for start, end, text in f['edits']:
                  assert type(start) is int and type(end) is int and 0 <= previous <= start <= end <= len(lines) and isinstance(text, str)
                  previous = end
              for start, end, text in reversed(f['edits']):
                  lines[start:end] = [text]
              output = ''.join(lines).encode()
              assert sha(output) == f['after'], 'Output mismatch: ' + name
              outputs.append((target, output))
          for target, output in outputs:
              target.write_bytes(output)
              print('Verified source:', target)
          PY
          git rm -r .space-stage .github/workflows/assemble-space.yml
          git add .github/workflows/p4-original-verify.yml src tests scripts docs README.md
          TREE=$(git write-tree)
          echo "Complete source tree: $TREE"
          test "$TREE" = '4925fc8cf4b95285b7ee74be59bc9cf66fafa7a4'
          git diff --check --cached
      - name: Preserve reviewed readable source
        if: always()
        run: |
          python - <<'PY'
          import subprocess, pathlib, zipfile
          with zipfile.ZipFile('space-reviewed-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in subprocess.check_output(['git','ls-files']).decode().splitlines():
                  p=pathlib.Path(name)
                  if p.is_file(): z.write(p,'Infinity/'+name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: space-reviewed-source
          path: space-reviewed-source.zip
          retention-days: 7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-ui-baseline.mjs
      - run: npm run build
      - run: npm test
      - name: Original-engine regression and pacing
        run: |
          mkdir -p "$RUNNER_TEMP/original-p3"
          git archive 69eca7107980cce3c4c24ce4736a91993c051fbd | tar -x -C "$RUNNER_TEMP/original-p3"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/original-p3/node_modules"
          node --import tsx scripts/check-original-parity.mjs "$RUNNER_TEMP/original-p3"
          npm run sim -- 60
      - name: Commit verified source to feature branch only
        run: |
          git config user.name scientistss
          git config user.email scientistss@users.noreply.github.com
          git commit -m '原版 P4：银河、舰队、实际殖民及存档 r2（226 测试）'
          git push origin HEAD:refs/heads/feat/p4-original-space
