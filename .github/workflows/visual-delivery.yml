name: Restore verified visual release

on:
  push:
    branches: [feat/p4-playable-core]
    paths: ['.visual-delivery/ready.json']

permissions:
  contents: write

concurrency:
  group: infinity-visual-source-delivery
  cancel-in-progress: false

jobs:
  restore:
    if: github.repository == 'scientistss/Infinity' && github.ref == 'refs/heads/feat/p4-playable-core'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/p4-playable-core
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Verify exact source and asset bytes before applying
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const zlib = require('node:zlib');
          const sha = bytes => crypto.createHash('sha256').update(bytes).digest('hex');
          const encoded = Array.from({length:12}, (_,i) => fs.readFileSync('.visual-delivery/bundle.' + i + '.b64','utf8').trim()).join('');
          const payload = zlib.brotliDecompressSync(Buffer.from(encoded,'base64'));
          if (sha(payload) !== 'b34de9c5a56d51f91dd243818c9a523d9dd3000dcc6df0543804e8b84e322601') throw Error('Complete bundle checksum mismatch');
          const files = JSON.parse(payload.toString('utf8'));
          if (!Array.isArray(files) || files.length !== 81) throw Error('Incomplete release');
          const seen = new Set();
          const outputs = [];
          for (const f of files) {
            if (!/^(src\/|tests\/|scripts\/|docs\/|public\/|README\.md$|index\.html$|package(-lock)?\.json$)/.test(f.path) || f.path.split('/').includes('..') || seen.has(f.path)) throw Error('Invalid path');
            seen.add(f.path);
            const exists = fs.existsSync(f.path);
            if (exists && fs.lstatSync(f.path).isSymbolicLink()) throw Error('Refusing symlink');
            const original = exists ? fs.readFileSync(f.path) : Buffer.alloc(0);
            if (f.before === null ? exists : !exists || sha(original) !== f.before) throw Error('Original source changed: ' + f.path);
            let result;
            if (typeof f.base64 === 'string') result = Buffer.from(f.base64,'base64');
            else {
              const lines = original.toString('utf8').match(/[^\n]*\n|[^\n]+$/g) || [];
              for (const [start,end,text] of [...f.edits].reverse()) lines.splice(start,end-start,text);
              result = Buffer.from(lines.join(''),'utf8');
            }
            if (sha(result) !== f.after) throw Error('Output checksum mismatch: ' + f.path);
            outputs.push([f.path,result]);
          }
          for (const [name,bytes] of outputs) {
            fs.mkdirSync(path.dirname(name),{recursive:true});
            fs.writeFileSync(name,bytes);
            console.log('Verified:',name);
          }
          JS
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run sim -- 60
      - name: Commit readable source and remove temporary transport data
        run: |
          git diff --check
          git config user.name 'scientistss'
          git config user.email 'scientistss@users.noreply.github.com'
          git rm -r .visual-delivery
          git add src tests scripts docs public README.md index.html package.json package-lock.json
          git commit -m '视觉升级：50 个哈希素材、v8→v9 安全迁移、原生浏览器验收（alpha.2）'
          git push origin HEAD:refs/heads/feat/p4-playable-core
