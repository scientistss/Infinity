name: Attribute published 7ab fleet and Save costs
on:
  push:
    branches: ['codex/infinity-fleet-profile-7ab-20261013']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TARGET_SHA: 7ab569045996a1a6ad8ce1aee477092144dfad74
      FIXTURE_SOURCE_SHA: 4bceefee9bb70cae3a86f6c3c31a6d0b540dac2b
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build unchanged published source and reproduce its actual workload
        timeout-minutes: 4
        run: |
          set -euo pipefail
          mkdir -p current-fleet-profile-evidence
          git worktree add --detach "$RUNNER_TEMP/current-fleet-target" "$TARGET_SHA"
          git worktree add --detach "$RUNNER_TEMP/current-fleet-r8" "$FIXTURE_SOURCE_SHA"
          git archive "$TARGET_SHA" > current-fleet-profile-evidence/target-source.tar
          git archive HEAD > current-fleet-profile-evidence/diagnostic-source.tar
          git diff --stat "$TARGET_SHA" HEAD > current-fleet-profile-evidence/diagnostic-diff.txt
          git diff --exit-code "$TARGET_SHA" HEAD -- src public package.json package-lock.json
          cd "$RUNNER_TEMP/current-fleet-target"
          npm ci
          ln -s "$RUNNER_TEMP/current-fleet-target/node_modules" "$RUNNER_TEMP/current-fleet-r8/node_modules"
          GITHUB_SHA="$TARGET_SHA" npm run build
          node --import tsx "$RUNNER_TEMP/current-fleet-r8/scripts/performance-fixture.ts" > "$GITHUB_WORKSPACE/current-fleet-profile-evidence/r8-combined.json"
          node --import tsx scripts/prepare-r9-performance.mjs --r8-source "$RUNNER_TEMP/current-fleet-r8" --fixture "$GITHUB_WORKSPACE/current-fleet-profile-evidence/r8-combined.json" > "$GITHUB_WORKSPACE/current-fleet-profile-evidence/combined-fixture.json"
          echo '51175269239ac45ac76b1ea8fc1f1bb3d6e9f42da58709b9ecdf6a171e680a98  current-fleet-profile-evidence/combined-fixture.json' | (cd "$GITHUB_WORKSPACE" && sha256sum -c -)
          # Hidden map is retained for offline attribution only. Its JS/CSS
          # must be byte-identical; the HTTP server below serves actual dist.
          node node_modules/vite/bin/vite.js build --sourcemap hidden --outDir "$RUNNER_TEMP/current-fleet-mapping"
          cd "$GITHUB_WORKSPACE"
          python scripts/test_current_fleet_map.py
          python scripts/bind-current-fleet-map.py --target-repo "$RUNNER_TEMP/current-fleet-target" --mapping-dist "$RUNNER_TEMP/current-fleet-mapping" --output current-fleet-profile-evidence/source-map
          python scripts/test_current_fleet_profile.py
      - name: Official Chrome and pinned Playwright prerequisites
        timeout-minutes: 2
        working-directory: ${{ runner.temp }}/current-fleet-target
        run: bash scripts/browser-prerequisites.sh
      - name: Nine bounded independent native diagnostic windows
        timeout-minutes: 4
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/current-fleet-http"
          ln -s "$RUNNER_TEMP/current-fleet-target/dist" "$RUNNER_TEMP/current-fleet-http/Infinity"
          python -m http.server 4176 --bind 127.0.0.1 --directory "$RUNNER_TEMP/current-fleet-http" > current-fleet-profile-evidence/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:4176/Infinity/release.json > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4176/Infinity/release.json > current-fleet-profile-evidence/http-release.json
          timeout --signal=TERM --kill-after=5s 205s python scripts/profile-current-fleet.py \
            --dist "$RUNNER_TEMP/current-fleet-target/dist" \
            --fixture current-fleet-profile-evidence/combined-fixture.json \
            --output current-fleet-profile-evidence/native
      - name: Strict whole-save checks outside all measurement windows
        timeout-minutes: 2
        working-directory: ${{ runner.temp }}/current-fleet-target
        run: node --import tsx "$GITHUB_WORKSPACE/scripts/check-current-fleet-saves.mjs" "$RUNNER_TEMP/current-fleet-target" "$GITHUB_WORKSPACE/current-fleet-profile-evidence/native"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-fleet-7ab-attribution-${{ github.sha }}
          path: current-fleet-profile-evidence
          retention-days: 7
          if-no-files-found: error
