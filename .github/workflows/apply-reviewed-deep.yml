name: Assemble reviewed deep-space source
on:
  push:
    branches: ['feat/p4-original-deep']
    paths: ['.review/deep-ready.json']
permissions:
  contents: write
concurrency:
  group: assemble-original-deep
  cancel-in-progress: false
jobs:
  assemble:
    if: github.repository == 'scientistss/Infinity' && github.ref == 'refs/heads/feat/p4-original-deep'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Verify all source inputs before writing any output
        run: |
          python - <<'PY'
          import json, hashlib, pathlib, re
          sha = lambda b: hashlib.sha256(b).hexdigest()
          plan = []
          for name in ['base', 'fleet', 'state', 'ui']:
              plan.extend(json.loads(pathlib.Path('.review/' + name + '-edits.json').read_text()))
          plan.sort(key=lambda f: f['path'])
          canonical = json.dumps(plan, sort_keys=True, ensure_ascii=False, separators=(',', ':')).encode()
          assert len(plan) == 20
          assert sha(canonical) == 'ab67a63c55b40b05330dea839ff94e79b15dab64b04944e70828e9d5cb1e13d7', 'Reviewed plan differs'
          seen, outputs = set(), []
          for f in plan:
              name = f['path']
              assert re.fullmatch(r'(src/|tests/|scripts/|docs/)[a-zA-Z0-9_./-]+|README.md|package(?:-lock)?\.json', name)
              assert name not in seen and '..' not in name.split('/')
              seen.add(name)
              target = pathlib.Path(name)
              assert not target.is_symlink() and all(not p.is_symlink() for p in target.parents)
              original = target.read_bytes()
              assert sha(original) == f['before'], 'Input mismatch: ' + name
              lines = original.decode().splitlines(keepends=True)
              previous = 0
              for start, end, text in f['edits']:
                  assert type(start) is int and type(end) is int and 0 <= previous <= start <= end <= len(lines) and isinstance(text, str)
                  previous = end
              for start, end, text in reversed(f['edits']):
                  lines[start:end] = [text]
              result = ''.join(lines).encode()
              assert sha(result) == f['after'], 'Output mismatch: ' + name
              outputs.append((target, result))
          new = json.loads(pathlib.Path('.review/new-files.json').read_text())
          assert len(new) == 13
          for name, expected in new.items():
              target = pathlib.Path(name)
              assert re.fullmatch(r'(src/|tests/|scripts/|docs/)[a-zA-Z0-9_./-]+', name) and '..' not in name.split('/')
              assert not target.is_symlink() and all(not p.is_symlink() for p in target.parents)
              actual = sha(target.read_bytes())
              assert actual == expected, 'New file mismatch: ' + name + ' got ' + actual
          for target, result in outputs:
              target.write_bytes(result)
              print('Verified source:', target)
          print('All 33 source files verified against the locally tested version.')
          PY
      - run: npm ci
      - run: npm run build
      - run: npm test -- --reporter=default --reporter=json --outputFile=test-results.json
      - name: Original engine regression
        run: |
          mkdir -p "$RUNNER_TEMP/original-p3"
          git archive 69eca7107980cce3c4c24ce4736a91993c051fbd | tar -x -C "$RUNNER_TEMP/original-p3"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/original-p3/node_modules"
          node --import tsx scripts/check-original-parity.mjs "$RUNNER_TEMP/original-p3" > parity-report.json
      - name: Commit source only; workflow cleanup is a separate reviewed connector commit
        run: |
          git add src tests scripts docs README.md package.json package-lock.json
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- .github)"
          git config user.name scientistss
          git config user.email scientistss@users.noreply.github.com
          git commit -m '深空循环：驻留、预掷返航、商人、黑洞保护、回收与遭遇战'
          git push origin HEAD:refs/heads/feat/p4-original-deep
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-source-verification
          path: |
            test-results.json
            parity-report.json
          retention-days: 7
          if-no-files-found: warn
