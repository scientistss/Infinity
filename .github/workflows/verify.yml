name: Verify game

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- --reporter=default --reporter=json --outputFile=test-results.json
      - name: Balance simulation
        run: npm run sim -- 60 | tee balance-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: infinity-verified-${{ github.sha }}
          path: |
            dist
            test-results.json
            balance-report.txt
          retention-days: 7
          if-no-files-found: error
