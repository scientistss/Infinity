name: Verify game

on:
  push:
    branches-ignore: [main]
    paths-ignore: ['.visual-delivery/**']
  pull_request:
    branches: [main]
    paths-ignore: ['.visual-delivery/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- --reporter=default --reporter=json --outputFile=test-results.json
      - name: Balance simulation
        run: npm run sim -- 60 | tee balance-report.txt
      - name: Install browser test dependencies
        if: hashFiles('scripts/browser-smoke.py') != ''
        run: |
          python -m pip install -r scripts/browser-requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Native browser, asset and save-migration acceptance
        if: hashFiles('scripts/browser-smoke.py') != ''
        run: |
          npx tsx scripts/p4-fixture.ts > p4-review-save.json
          npm run preview -- --host 127.0.0.1 --port 4173 > preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/Infinity/release.json > /dev/null; then break; fi
            sleep 1
          done
          python scripts/browser-smoke.py --verify-dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infinity-verified-${{ github.sha }}
          path: |
            dist
            test-results.json
            balance-report.txt
            browser-evidence
            preview.log
          retention-days: 7
          if-no-files-found: error
