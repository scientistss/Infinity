name: Verify game

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Balance simulation
        run: npm run sim -- 60 | tee balance-report.txt
      - name: Create reproducible review workspace
        run: |
          tar -czf /tmp/infinity-workspace.tgz src tests scripts public docs node_modules dist package.json package-lock.json tsconfig.json vite.config.ts index.html README.md LICENSE .gitignore .github balance-report.txt
          mv /tmp/infinity-workspace.tgz infinity-workspace.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: infinity-review-${{ github.sha }}
          path: infinity-workspace.tgz
          retention-days: 1
          if-no-files-found: error
